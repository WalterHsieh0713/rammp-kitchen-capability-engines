# This capability's contract, as code: sheppy's `alternative` schema plus
# RAMMP's `tier` (and `implements`, once a role contract exists). It is
# transcribed into rammp-deployments/december_2026/sheppy-manifest.yaml.
#
# Keys under `container:` are the compose subset sheppy supports: image,
# command, entrypoint, environment, env_file, network_mode, volumes, devices,
# gpus, privileged, cap_add, cap_drop, ports, user, working_dir. Declare
# hardware here, never in a README step. Do not set RMW_IMPLEMENTATION or
# CYCLONEDDS_URI; rammp-base owns them.
id: place_container_real
tier: experimental
kind: docker
container:
  # :dev is mutable and overwritten on every merge to dev. A demo profile needs
  # a release tag or digest; `tier: demo-ready` is rejected without one.
  image: ghcr.io/rammp-org/rammp-kitchen-capability-engines/place_container:dev
  network_mode: host
  ipc: host
  # Runs the same node as the image's CMD, without the launch file. sheppy
  # appends `--ros-args --params-file` to the command; with no command, those
  # args replace the CMD and the node never starts. Run the node's executable
  # (`ros2 run`), never `ros2 launch`, which rejects them.
  command: ["ros2", "run", "place_container", "place_container_node"]
  # state_dir: the marked spot, the start position and the descent recordings, kept across restarts.
  volumes:
    - /config/place_container:/config/place_container
# Defaults for every value a deployment may change per robot or from the sheppy
# TUI; a profile can override only keys listed here. Hosts, ports and file
# paths go here too, never hard-coded in the node.
params:
  # The arm moves only with this true AND `execute` in the goal; otherwise every goal is a dry run.
  # true only for attended runs, someone on the e-stop.
  allow_execute: false
  # Flange face to the closed fingertips (m): where the container centre lands. Not ruler-measured yet.
  flange_to_tip: 0.17955
  # The hand points this many deg down while placing, so the container touches before the fingers.
  pitch_deg: 5.0
  # Contact: the hand's z velocity (m/s, + up) back up to this after moving down.
  vz_stop: -0.01
  # The hold after contact, this far (m) below the contact point, while the gripper opens.
  hold_press: 0.003
  # Held in impedance at the start this long (s) before going down; must end still.
  settle_s: 3.0
  # Contact more than this (m) above where the bottom meets the table = not the table.
  early_stop: 0.03
  # Joint impedance for the settle, lowering, hold, retreat and reset (one set: the stiffness never changes
  # mid-place). The driver's documented starting point, not the "medium" profile RAMMP-table used.
  impedance_kq: [80.0, 80.0, 80.0, 80.0, 30.0, 30.0, 30.0]
  impedance_zeta: 0.5
  impedance_torque_limit: [39.0, 39.0, 39.0, 39.0, 9.0, 9.0, 9.0]
  # Speeds. The hand's speed where the table should be (m/s): what the contact test was tuned at.
  lower_speed: 0.02
  # The rest is 2x RAMMP-table's: speed_scale of the carrying moves (go_to_ee_pose),
  go_to_speed_scale: 0.4
  # of the squaring turn and of reset's joint moves (move_joints),
  adjust_speed_scale: 1.0
  reset_speed_scale: 1.0
  # and the retreat's peak speed (m/s).
  retreat_speed: 0.06
  # Spot distance from the arm base axis (m) with the full descent (flatbot, table z 0.198).
  reach: [0.70, 1.10]
  # Where the line down can't reach the table in the arm's posture, switch to another posture that can
  # (go_to_joint_config: a bigger move, no level hold); false = refuse instead.
  allow_reconfigure: false
  # The squaring turn may correct at most this much (deg).
  max_adjust_deg: 15.0
  # A marked spot older than this (min) is refused: the chair may have moved.
  max_spot_age_min: 30.0
  # The arm's tool frame vs the model's (m).
  tool_frame_tol: 0.015
  # Where the marked spot, the start position and the descent recordings are kept.
  state_dir: /config/place_container
  # arm.*: every tunable of self.arm; see Parameters in docs/interface.md.
  "arm.tool_z": 0.12
  "arm.dt": 0.02
  "arm.joint_speed": 0.85
  "arm.cart_speed": 0.16
  "arm.contact_joint_speed": 0.5
  "arm.contact_cart_speed": 0.09
  "arm.min_duration_s": 1.0
  "arm.cart_step_m": 0.02
  "arm.cart_step_deg": 5.0
  "arm.rot_equiv_m": 0.15
  "arm.max_knot_jump_deg": 20.0
  "arm.path_tol_rad": 0.15
  "arm.gripper_force": 0.5
  "arm.gripper_speed": 0.5
  "arm.frame": "arm_mount"
  "arm.go_to_speed_scale": 0.3
  "arm.go_to_timeout_s": 120.0
  "arm.go_to_track_m": 0.01
  "arm.go_to_track_deg": 2.0
  "arm.max_ik_err": 0.02
  "arm.max_step_jump_deg": 20.0
  "arm.j6_guard_deg": 115.0
  "arm.j4_guard_deg": 144.0
  "arm.max_continuous_delta_deg": 170.0
  "arm.keep_out_err": 9.0
  "arm.ik_max_iterations": 200
  "arm.clearance_query_m": 0.5
  "arm.fingertip_open_rad": 0.0
  "arm.finger_closed_rad": 0.7
  "arm.state_wait_s": 10.0
  "arm.state_stale_s": 0.5
  "arm.diagnostics_stale_s": 3.0
  "arm.goal_accept_s": 5.0
  "arm.result_margin_s": 30.0
  "arm.poll_s": 0.01
  "arm.cancel_settle_s": 0.4
  "arm.halt_status_wait_s": 0.2
  "arm.planner_wait_s": 5.0
  "arm.go_to_settle_s": 0.3
  "arm.gripper_period_s": 0.02
  "arm.gripper_moved": 0.002
  "arm.gripper_judge_after_s": 0.5
  "arm.gripper_still_s": 0.3
  "arm.plan_timeout_s": 30.0
  "arm.service_wait_s": 5.0
  "arm.service_call_s": 10.0
  "arm.stream_timeout_s": 0.1
  "arm.publisher_match_s": 1.0
  "arm.close_stream_wait_s": 1.0
  "arm.mock_joints": [0.0, 0.26, 3.14, -2.27, 0.0, 0.96, 1.57]
  "arm.mock_urdf": ""
publishes: [/place_container/status]
subscribes: []
