# The mock: the real alternative's exact interface, no hardware. Other teams
# develop against it, the all-mock profile runs on it, and CI smoke-tests it.
# check_capabilities.py rejects a mock whose topics differ from the real one.
id: example_mock
tier: experimental
kind: docker
container:
  image: ghcr.io/rammp-org/rammp-kitchen-capability-engines/example:dev
  network_mode: host
  ipc: host
  command: ["python3", "/app/example_node.py", "--ros-args", "-p", "mock:=true"]
publishes: [/example/status]
subscribes: []
